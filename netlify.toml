[build]
  command = "npm run build"
  publish = "dist"
  functions = "functions"
  # Disable excessive secrets scanning - Firebase public keys are meant for client-side use
  # Security is enforced through Firebase rules and authentication, not key secrecy
  SECRETS_SCAN_ENABLED = false

# Note: Environment variables are configured in Netlify Site Settings
# Do NOT define them here (empty values would override settings from UI)

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# Cache control - don't cache index.html
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache assets for 1 year since they have content hash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA routing - redirect all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
